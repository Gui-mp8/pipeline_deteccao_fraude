name: Test GCP Auth

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-gcp-auth:
    name: Check GCP Auth
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/413763713999/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "case-594@case-grupo-otg.iam.gserviceaccount.com"

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Test project access
        run: |
          gcloud projects describe case-grupo-otg
