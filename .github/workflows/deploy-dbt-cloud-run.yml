name: Deploy dbt to Cloud Run Job

on:
  push:
    branches: [main]
    paths:
      - "dbt/**"
      - "Dockerfile.dbt"
      - "scripts/dbt-entrypoint.sh"
      - ".github/workflows/deploy-dbt-cloud-run.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'case-grupo-otg1' }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  GAR_REPOSITORY: ${{ vars.DBT_ARTIFACT_REGISTRY_REPOSITORY || 'gar-imagens' }}
  IMAGE_NAME: ${{ vars.DBT_IMAGE_NAME || 'fraud-dbt' }}
  JOB_NAME: ${{ vars.DBT_CLOUD_RUN_JOB || 'fraud-dbt' }}
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.DBT_RUNTIME_SERVICE_ACCOUNT || 'case-594@case-grupo-otg1.iam.gserviceaccount.com' }}

jobs:
  build-dbt-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/712304487497/locations/global/workloadIdentityPools/github-pool/providers/github-provider' }}
          service_account: ${{ secrets.GCP_GITHUB_ACTIONS_SERVICE_ACCOUNT || vars.GCP_GITHUB_ACTIONS_SERVICE_ACCOUNT || 'case-594@case-grupo-otg1.iam.gserviceaccount.com' }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build, validate and push dbt image
        run: |
          set -euo pipefail
          image_uri="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          latest_uri="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:latest"
          docker build -f Dockerfile.dbt -t "${image_uri}" -t "${latest_uri}" .
          docker run --rm "${image_uri}" parse
          docker push "${image_uri}"
          docker push "${latest_uri}"
          echo "IMAGE_URI=${image_uri}" >> "${GITHUB_ENV}"

      - name: Export image artifact
        run: printf '%s' "${IMAGE_URI}" > /tmp/dbt-image-uri.txt

      - name: Upload image URI
        uses: actions/upload-artifact@v4
        with:
          name: dbt-image-uri
          path: /tmp/dbt-image-uri.txt

  deploy-dbt-job:
    runs-on: ubuntu-latest
    needs: build-dbt-image

    steps:
      - name: Auth GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/712304487497/locations/global/workloadIdentityPools/github-pool/providers/github-provider' }}
          service_account: ${{ secrets.GCP_GITHUB_ACTIONS_SERVICE_ACCOUNT || vars.GCP_GITHUB_ACTIONS_SERVICE_ACCOUNT || 'case-594@case-grupo-otg1.iam.gserviceaccount.com' }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Download image URI
        uses: actions/download-artifact@v4
        with:
          name: dbt-image-uri
          path: /tmp

      - name: Deploy dbt Cloud Run Job
        shell: bash
        run: |
          set -euo pipefail
          image_uri="$(cat /tmp/dbt-image-uri.txt)"
          gcloud run jobs deploy "${JOB_NAME}" \
            --image="${image_uri}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --memory="512Mi" \
            --cpu="1" \
            --max-retries="1" \
            --tasks="1" \
            --task-timeout="1800s" \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --set-env-vars="GCP_PROJECT_ID=${PROJECT_ID},DBT_TARGET=cloud_run,BRONZE_DATASET=case_bronze,DBT_DATASET=case_silver,GCP_LOCATION=${REGION}"
