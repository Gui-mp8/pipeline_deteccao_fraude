name: Deploy Python Jobs to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "jobs/**"
      - "tests/jobs/**"
      - "requirements-dev.txt"
      - ".github/workflows/deploy-jobs-cloud-run.yml"
  workflow_dispatch:
    inputs:
      deploy_scope:
        description: "Deploy changed jobs or all jobs"
        required: true
        default: "changed"
        type: choice
        options:
          - changed
          - all

permissions:
  contents: read
  id-token: write

env:
  DEFAULT_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  DEFAULT_REGION: ${{ vars.GCP_REGION || 'southamerica-east1' }}
  DEFAULT_ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.JOBS_ARTIFACT_REGISTRY_REPOSITORY || 'fraud-jobs' }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -q

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Auth GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_GITHUB_ACTIONS_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Select job directories
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_SCOPE="${{ github.event.inputs.deploy_scope || 'changed' }}"
          if [ "${DEPLOY_SCOPE}" = "all" ]; then
            find jobs -type f -name settings.yaml -printf '%h\n' | sort -u > /tmp/job_dirs.txt
          else
            git diff --name-only HEAD^ HEAD -- 'jobs/**' |
              while IFS= read -r changed_file; do
                search_dir="$(dirname "${changed_file}")"
                while [ "${search_dir}" != "." ] && [ "${search_dir}" != "/" ]; do
                  if [ -f "${search_dir}/settings.yaml" ]; then
                    printf '%s\n' "${search_dir}"
                    break
                  fi
                  search_dir="$(dirname "${search_dir}")"
                done
              done | sort -u > /tmp/job_dirs.txt
          fi
          cat /tmp/job_dirs.txt || true

      - name: Build and deploy selected jobs
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /tmp/job_dirs.txt ]; then
            echo "No job directories selected."
            exit 0
          fi

          while IFS= read -r job_dir; do
            config_file="${job_dir}/settings.yaml"
            job_name="$(yq '.name' "${config_file}")"
            project_id="$(yq '.project_id // env(DEFAULT_PROJECT_ID)' "${config_file}")"
            region="$(yq '.region // env(DEFAULT_REGION)' "${config_file}")"
            repo="$(yq '.artifact_registry_repository // env(DEFAULT_ARTIFACT_REGISTRY_REPOSITORY)' "${config_file}")"
            image_name="$(yq '.image_name // .name' "${config_file}")"
            memory="$(yq '.memory // "512Mi"' "${config_file}")"
            cpu="$(yq '.cpu // "1"' "${config_file}")"
            max_retries="$(yq '.max_retries // "1"' "${config_file}")"
            tasks="$(yq '.tasks // "1"' "${config_file}")"
            timeout="$(yq '.timeout // "900s"' "${config_file}")"
            service_account="$(yq '.service_account // ""' "${config_file}")"
            image_uri="${region}-docker.pkg.dev/${project_id}/${repo}/${image_name}:${GITHUB_SHA}"

            gcloud auth configure-docker "${region}-docker.pkg.dev" --quiet
            gcloud builds submit "${job_dir}" --tag "${image_uri}" --project "${project_id}"

            deploy_args=(
              run jobs deploy "${job_name}"
              --image="${image_uri}"
              --region="${region}"
              --project="${project_id}"
              --memory="${memory}"
              --cpu="${cpu}"
              --max-retries="${max_retries}"
              --tasks="${tasks}"
              --task-timeout="${timeout}"
            )
            if [ -n "${service_account}" ]; then
              deploy_args+=(--service-account="${service_account}")
            fi
            while IFS= read -r env_pair; do
              deploy_args+=(--set-env-vars="${env_pair}")
            done < <(yq '.env // {} | to_entries[] | "\(.key)=\(.value)"' "${config_file}")
            gcloud "${deploy_args[@]}"
          done < /tmp/job_dirs.txt
