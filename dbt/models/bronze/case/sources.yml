version: 2

sources:
  - name: raw_fraud
    database: "case-grupo-otg1"
    schema: "case_bronze"
    description: "External BigQuery tables backed by staging Parquet files in Cloud Storage."

    tables:
      - name: players
        description: "Raw player registration data, one row per player as provided by the source."
        columns:
          - name: player_id
            data_tests:
              - not_null:
                  config:
                    where: |
                      dt >= DATE('1900-01-01')
                      AND dt <= CURRENT_DATE()
          - name: dt
            data_tests:
              - not_null:
                  config:
                    where: |
                      dt >= DATE('1900-01-01')
                      AND dt <= CURRENT_DATE()

      - name: sessions
        description: "Raw access sessions, one row per player session."
        columns:
          - name: session_id
            data_tests:
              - not_null:
                  config:
                    where: |
                      dt >= DATE('1900-01-01')
                      AND dt <= CURRENT_DATE()
          - name: dt
            data_tests:
              - not_null:
                  config:
                    where: |
                      dt >= DATE('1900-01-01')
                      AND dt <= CURRENT_DATE()

      - name: transactions
        description: "Raw financial movements, one row per transaction."
        columns:
          - name: transaction_id
            data_tests:
              - not_null:
                  config:
                    where: |
                      dt >= DATE('1900-01-01')
                      AND dt <= CURRENT_DATE()
          - name: dt
            data_tests:
              - not_null:
                  config:
                    where: |
                      dt >= DATE('1900-01-01')
                      AND dt <= CURRENT_DATE()

      - name: affiliate_cpa_ftd
        description: "Raw affiliate acquisition funnel metrics, one row per affiliate/player/country observation."
        columns:
          - name: affiliate_id
            data_tests:
              - not_null:
                  config:
                    where: |
                      ingest_date >= DATE('1900-01-01')
                      AND ingest_date <= CURRENT_DATE()
          - name: ingest_date
            data_tests:
              - not_null:
                  config:
                    where: |
                      ingest_date >= DATE('1900-01-01')
                      AND ingest_date <= CURRENT_DATE()
