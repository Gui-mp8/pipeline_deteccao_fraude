version: 2

models:
  - name: slv_players
    description: "Clean player dimension. One row per player with normalized email and registration attributes used to enrich fraud analysis."
    columns:
      - name: player_id
        description: "Stable player identifier from the source."
        data_tests:
          - not_null
          - unique
      - name: email
        description: "Lowercase trimmed email; useful for domain-level and duplicate-account analysis."
        data_tests:
          - not_null
      - name: created_at
        description: "Player registration date used as the incremental and cohort field."

  - name: slv_sessions
    description: "Clean access sessions. One row per session with normalized device and parsed timestamp for behavioral analysis."
    columns:
      - name: session_id
        description: "Stable session identifier."
        data_tests:
          - not_null
          - unique
      - name: player_id
        description: "Player associated with the session."
        data_tests:
          - not_null
          - relationships:
              to: ref('slv_players')
              field: player_id
      - name: session_date
        description: "Date partition derived from session timestamp."
        data_tests:
          - not_null
      - name: device
        description: "Normalized device family observed in the session."

  - name: slv_transactions
    description: "Clean financial movements. One row per transaction with split measures for deposits, withdrawals and bets."
    columns:
      - name: transaction_id
        description: "Stable transaction identifier."
        data_tests:
          - not_null
          - unique
      - name: player_id
        description: "Player associated with the financial movement."
        data_tests:
          - not_null
          - relationships:
              to: ref('slv_players')
              field: player_id
      - name: transaction_type
        description: "Normalized movement type accepted by the case."
        data_tests:
          - accepted_values:
              values: ["deposit", "withdraw", "bet"]
      - name: amount
        description: "Non-negative movement amount."
        data_tests:
          - not_null
      - name: transaction_date
        description: "Date partition derived from transaction timestamp."
        data_tests:
          - not_null

  - name: slv_affiliate_cpa_ftd
    description: "Clean affiliate CPA/FTD attribution. One row per affiliate, player and country with acquisition funnel anomaly flags."
    columns:
      - name: affiliate_player_country_key
        description: "Surrogate key for the affiliate-player-country grain."
        data_tests:
          - not_null
          - unique
      - name: player_id
        description: "Attributed player identifier."
        data_tests:
          - not_null
          - relationships:
              to: ref('slv_players')
              field: player_id
      - name: country
        description: "Uppercase country code associated with the affiliate attribution row."
        data_tests:
          - not_null
          - accepted_values:
              values: ["AR", "BR", "CL", "CO", "MX"]
