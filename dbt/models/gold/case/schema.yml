version: 2

models:
  - name: gold_financial_signals
    description: "Player-level financial aggregates and anomaly flags for risk triage."
    columns:
      - name: player_id
        data_tests:
          - not_null
          - unique
      - name: withdraw_to_deposit_ratio
        description: "Withdrawal pressure against deposits; high values can indicate abuse or laundering risk."

  - name: gold_affiliate_metrics
    description: "Affiliate-country performance mart for dashboarding CPA efficiency and suspicious funnel behavior."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ["affiliate_id", "country"]
    columns:
      - name: affiliate_id
        data_tests:
          - not_null
      - name: country
        data_tests:
          - not_null

  - name: gold_fraud_overview
    description: "Player-level fraud overview combining identity, behavior, finance and affiliate funnel signals."
    columns:
      - name: player_id
        data_tests:
          - not_null
          - unique
      - name: fraud_signal_count
        description: "Count of active fraud signals; intended for dashboard prioritization and alert ranking."
        data_tests:
          - not_null
